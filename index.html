<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure JS 3D Car</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap');
        body { margin: 0; overflow: hidden; font-family: 'Montserrat', sans-serif; }
        #loadingscreen{
            position: absolute;
            top:0;
            left:0;
            width: 100vw;
            height: 100vh;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .loadingtitle{
            letter-spacing: 4px;
            font-weight: 300;
            margin-bottom: 20px;
        }
        .progcunt{
            width: 300px;
            height: 2px;
            background: rgba(255,255,255,0.1)
        }
        #progbar{
            width: 0;
            height: 2px;
            background: #fff;
            transition: width 0.1s linear;
        }
        .toolbar{
            position: absolute;
            left: 10px; top:30px; bottom: 30px;
            width: 40px;
            height: 50vh;
            background: rgba(10,10,10,0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255,255,255,0.01);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            pointer-events: auto;
            z-index: 100;
            border-radius: 50px;

        }
        .iconbtn{
            width: 44px; height: 44px;
            background:transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .iconbtn:hover{
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .iconbtn img{
            width: 24px; 
        }
        .iconbtn svg{width: 20px; height: 20px; fill: #fff;}
        .space {flex-grow: 1;}
        .modeldrawer{
            position: absolute;
            left: 70px;
            top: 0;
            width: 340px;
            height: 100vh;
            padding: 40px 30px;
            box-sizing: border-box;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
            z-index: 90;
            transform: translateX(-150%);
            transition: transform 0.5s cubic-bezier(0.4,0,0.2,1)
        }
        .modeldrawer.open{transform: translateX(0);}
        .titledrawer{color:white; font-size: 12px; letter-spacing: 4px; font-weight: 300; margin-bottom: 30px;}
        .carcard{
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.5s
        }
        .carcard:hover{
            border-color: #d4af37; 
            transform: translateY(-3px);
        }
        .carcard img{
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }
        .carname{
            background: #111;
            padding: 15px; 
            color: white; 
            font-size: 11px;
            letter-spacing:2px;
            text-transform: uppercase;
            text-align: center;
        }
        .graphicsmenu{
            position: absolute; 
            top: 215px; 
            left: 95px;
            width: 250px; 
            background: rgba(15,15,15,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 8px;
            padding: 20px;
            color: white;
            opacity: 0;
            transform: translateX(-15px) scale(0.98);
            pointer-events: none;
            z-index: 95;
            transition: transform 0.5s cubic-bezier(0.4,0,0.2,1)
        }
        .graphicsmenu.open{
            opacity: 1;
            transform: translateX(0) scale(1);
            pointer-events: auto;
        }
    
        .upperletter{
            margin-top: 0; 
            border-bottom: 1px solid #555; 
            padding-bottom: 10px;
        }
        .label{
            display: flex; 
            justify-content: space-between;
        }
        .quality{
            width: 100%;
            padding: 5px; 
            background: #333; 
            color: white; 
            border: none; 
            border-radius: 5px;
        }
    </style>
    <div id="loadingscreen">
        <div class="loadingtitle"><center>Initializing 3D Model </center><br>(Use Headphones For a better experience)</br> </div>
        <div class="progcunt">
            <div id="progbar"></div>
        </div>
    </div>

    <div id="ui" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100;">
        
        <div class="toolbar">
            <button id="btnmenu" class="iconbtn" title="Select Model">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            
            <div style="height: 30px;"></div> 
            <button id="btnedit" class="iconbtn" title="Shit edit">
                <img src="./images/cook.png">
            </button>
            <button id="btnsettings" class="iconbtn" title="Settings">
               <img src="./images/settings.png">
            </button>
            <button id="btnview" class="iconbtn" title="Cabin View">
                <img src="./images/camera.png">
            </button>
            <button id="btnengine" class="iconbtn" title="Engine Start">
                <img src="./images/engine.png">
            </button>
            <button id="btnlights" class="iconbtn" title="Headlights">
                <img src="./images/headlight.png">
            </button>
            
            <div class="space"></div>
            
            <button id="btnleft" class="iconbtn" title="Left Blinker">
                <img src = "./images/leftblinker.png">
            </button>
            <button id="btnhazard" class="iconbtn" title="Hazards">
                <img src = "./images/hazard.png">
            </button>
            <button id="btnright" class="iconbtn" title="Right Blinker">
                <img src = "./images/rightblinker.png">
            </button>
        </div>

        <div class="modeldrawer" id="modeldrawer">
            <div class="carcard" data-model="./3D_Models/modelDraco6.glb">
                <img src="./images/rollsrender.webp" alt="Ghost">
                <div class="carname">Rolls Royce Ghost (V12)</div>
            </div> 
            <div class="carcard" data-model="./3D_Models/astonDraco.glb">
               <img src="./images/astonrender.jpg" alt="Aston Martin Zagato">
                <div class="carname">Aston Martin DBS GT Zagato</div>
            </div>
            <div class="carcard" data-model="./3D_Models/modelDraco10.glb">
               <img src="./images/ferrari.jpg" alt="Aston Martin Zagato">
                <div class="carname">Ferrari SF90 XX Stradale</div>
            </div>
        </div>
    </div>
    <div id="graphicsmenu" class="graphicsmenu">
    <h3 class="upperletter">Graphics</h3>
    
    <div style="margin-bottom: 15px;">
        <label class="label"> Exposure <span id="exposurevalue">1.0</span></label>
        <input type="range" id="exposure" min="0.1" max="3" step="0.1" value="1.0" style="width: 100%">
    </div>
    
    <div style="margin-bottom: 15px">
        <label class="label"> Bloom Strength: <span id="inbloom">0.2</span></label>
        <input type="range" id="bloom" min="0" max="0.5" step="0.1" value="0.2" style="width: 100%">
    </div>
    
    <div style="margin-bottom: 15px;">
        <label style="display: flex; justify-content: space-between;"> Anti-Aliasing <span id="valmsaa">4x</span></label>
        <input type="range" id="antialaishing" min="0" max="4" step="1" value="2" style="width: 100%;">
    </div>
    
    <div style="margin-bottom: 10px;">
        <label style="display: block; margin-bottom: 5px;"> Overall Quality: </label>
        <select id="selquality" class="quality">
            <option value="low">Potato (Best Performance)</option>
            <option value="medium">Good (not too bad visuals)</option>
            <option value="high" selected>Epic (Best Visuals)</option>
        </select>
       </div>
    </div>

    <script type="module"
        src = '/main.js';>
    </script>
</body>
</html>
