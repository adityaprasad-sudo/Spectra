<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initialscale = 1.0">
    <title>Spectra</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class = "nav">
        <div class = "logo"> <img src= "images/vegetable.png" alt="vegetable" width = 22px, height = 18px><span> Spectra </span></div>
        <div class = "links">
            <a href="#meal">Meal Prep</a>
            <a href="#restaurant">Restaurant browser</a>
        </div>
    </div>

<div class="main">
    <div  class = "content">
        <h1>Eat food of your CHOICE</h1>
        <p>Select Restaurants that suits your goals</p>
        <a href="#restaurant" class="btn1">Lets Go</a>
    </div>
</div>

<div class = "container">
    <div id="meal" class = "card">
        <h2><img src="images/meal.png", width=20px, height=20px>Meal planner</h2>
        <p class="cardes">Tell us whats in your fridge and whats your goal</p>
        <label for="ingerdiants"> Your Ingrediants</label>
        <button class="photo">Take Photo</button>
        <button class="barcode">Scan barcode</button>
        <textarea id="ingrediants" placeholder="eg chicken, rice, eggs"></textarea>
        <label >Your goal</label>
        <div class="goal" id="goal">
        </div>
        <h5 for ="days">Number of days: <span id = "days-display"></span></h5>
        <input type="range" id="days" min="1" max="7" value="3" <!-- Max value 7 days because the food could expire that aint good-->
        <p class="err" id="mealerr">
            <button class="btn2" id="mealbtn">Gnerate Meal Prep planner</button>
        </p>
        <div class="spinner" id="mealspin"></div>
        <div id="mealout"></div>
        </div>
        <div class="overlay" id="scanner">
        <div class="content2">
            <h3>Scan Food Barcode</h3>
            <div id="reader"></div>
            <button class="btnclose" id="scanclose">Cancel</button>
        </div>
    </div>
     

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="script.js"></script>

</body>
 
</div>
