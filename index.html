<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure JS 3D Car</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap');
        body { margin: 0; overflow: hidden; font-family: 'Montserrat', sans-serif; }
        #loadingscreen{
            position: absolute;
            top:0;
            left:0;
            width: 100vw;
            height: 100vh;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .loadingtitle{
            letter-spacing: 4px;
            font-weight: 300;
            margin-bottom: 20px;
        }
        .progcunt{
            width: 300px;
            height: 2px;
            background: rgba(255,255,255,0.1)
        }
        #progbar{
            width: 0;
            height: 2px;
            background: #fff;
            transition: width 0.1s linear;
        }
        .toolbar{
            position: absolute;
            left: 0; top:0;
            width: 70px;
            height: 100vh;
            background: rgba(10,10,10,0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            pointer-events: auto;
            z-index: 100;

        }
        .iconbtn{
            width: 44px; height: 44px;
            background:transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .iconbtn:hover{
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .iconbtn img{
            width: 24px; 
        }
        .iconbtn svg{width: 20px; height: 20px; fill: #fff;}
        .space {flex-grow: 1;}
        .modeldrawer{
            position: absolute;
            left: 70px;
            top: 0;
            width: 340px;
            height: 100vh;
            background: rgba(15,15,15,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 40px 30px;
            box-sizing: border-box;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
            z-index: 90;
            transform: translateX(-120%);
            transition: transform 0.5s cubic-bezier(0.4,0,0.2,1)
        }
        .modeldrawer.open{transform: translateX(0);}
        .titledrawer{color:white; font-size: 12px; letter-spacing: 4px; font-weight: 300; margin-bottom: 30px;}
        .carcard{
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.5s
        }
        .carcard:hover{
            border-color: #d4af37; 
            transform: translateY(-3px);
        }
        .carcard img{
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }
        .carname{
            background: #111;
            padding: 15px; 
            color: white; 
            font-size: 11px;
            letter-spacing:2px;
            text-transform: uppercase;
            text-align: center;
        }
    </style>
    <div id="loadingscreen">
        <div class="loadingtitle">Initializing 3D Model(Use Headphones For a better experience)</div>
        <div class="progcunt">
            <div id="progbar"></div>
        </div>
    </div>

    <div id="ui" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100;">
        
        <div class="toolbar">
            <button id="btnmenu" class="iconbtn" title="Select Model">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            
            <div style="height: 30px;"></div> 
            <button id="btnedit" class="iconbtn" title="Shit edit">
                <img src="./images/cook.png">
            </button>
            <button id="btnview" class="iconbtn" title="Cabin View">
                <img src="./images/camera.png">
            </button>
            <button id="btnengine" class="iconbtn" title="Engine Start">
                <img src="./images/engine.png">
            </button>
            <button id="btnlights" class="iconbtn" title="Headlights">
                <img src="./images/headlight.png">
            </button>
            
            <div class="space"></div>
            
            <button id="btnleft" class="iconbtn" title="Left Blinker">
                <img src = "./images/leftblinker.png">
            </button>
            <button id="btnhazard" class="iconbtn" title="Hazards">
                <img src = "./images/hazard.png">
            </button>
            <button id="btnright" class="iconbtn" title="Right Blinker">
                <img src = "./images/rightblinker.png">
            </button>
        </div>

        <div class="modeldrawer" id="modeldrawer">
            <div class="drawertitle">Select Model</div>
            <div class="carcard" data-model="./3D_Models/modelDraco6.glb">
                <img src="https://public.blenderkit.com/thumbnails/assets/860f5a12a25546c8984a12d0dde0b773/files/thumbnail_6fa2ea7d-ca8d-4a4a-a4b3-fc4358af5e39.jpg.256x256_q85_crop-%2C.jpg.webp?webp_generated=1766443301" alt="Ghost">
                <div class="carname">Rolls Royce Ghost (V12)</div>
            </div> 
            <div class="carcard" data-model="./3D_Models/astonDraco.glb">
               <img src="https://static.wikia.nocookie.net/asphalt/images/0/01/A9-DBS-Zagato.png/revision/latest?cb=20231212161533" alt="Aston Martin Zagato">
                <div class="carname">Aston Martin DBS GT Zagato</div>
            </div>
            <div class="carcard" data-model="./3D_Models/modelDraco10.glb">
               <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVCd3BuwrRidu3_alzWWOgjF4OsH4fZE5syw&s" alt="Aston Martin Zagato">
                <div class="carname">Ferrari SF90 XX Stradale</div>
            </div>
        </div>
    </div>
    <div id="graphics-settings" style="position: absolute; bottom: 30px; right: 30px; background: rgba(15,15,15,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 8px; z-index: 100; font-family: 'Montserrat', sans-serif; color: white;">
        <div style="font-size: 10px; letter-spacing: 3px; font-weight: 300; text-transform: uppercase; margin-bottom: 15px; color: #aaa;">Graphics</div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 20px;">
            <div style="font-size: 13px;">Anti-Aliasing</div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <input type="range" id="msaaSlider" min="0" max="3" step="1" value="2" style="cursor: pointer; width: 80px; accent-color: #d4af37;">
                <div id="msaaReadout" style="font-size: 13px; font-weight: bold; width: 25px; text-align: right;">4x</div>
            </div>
        </div>
    </div>

    <script type="module"
        src = '/main.js';>
    </script>
</body>
</html>
